<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600&family=Fraunces:opsz,wght@9..144,600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #efece6;
      }
      .stage {
        position: relative;
        width: 1200px;
        height: 630px;
      }
      .bg {
        position: absolute;
        inset: 0;
        width: 1200px;
        height: 630px;
        object-fit: cover;
        object-position: center 46%;
      }
      .vignette {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse at 50% 48%, rgba(239, 236, 230, 0.08) 0%, rgba(22, 24, 29, 0.18) 100%);
      }
      .lockup {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 640px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 56px 36px;
        background: rgba(251, 250, 247, 0.9);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-radius: 24px;
        box-shadow:
          0 0 0 1px rgba(26, 25, 22, 0.08),
          0 18px 48px rgba(26, 25, 22, 0.1);
      }
      .mark {
        width: 44px;
        height: 44px;
        margin-bottom: 18px;
      }
      h1 {
        font-family: "Fraunces", Georgia, serif;
        font-optical-sizing: auto;
        font-weight: 600;
        font-size: 88px;
        line-height: 0.92;
        letter-spacing: -0.03em;
        color: #1a1916;
      }
      .rule {
        width: 48px;
        height: 3px;
        border-radius: 2px;
        background: #1f4e8c;
        margin: 18px 0 14px;
      }
      p {
        font-family: "Figtree", ui-sans-serif, system-ui, sans-serif;
        font-weight: 500;
        font-size: 22px;
        letter-spacing: 0.01em;
        color: #6f6b63;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <img class="bg" src="./og-bg.jpg" alt="" />
      <div class="vignette"></div>
      <div class="lockup">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#1f4e8c" />
          <rect x="8" y="9" width="16" height="3.2" rx="1.4" fill="#fbfaf7" />
          <rect x="8" y="14.4" width="12" height="3.2" rx="1.4" fill="#fbfaf7" />
          <rect x="8" y="19.8" width="8" height="3.2" rx="1.4" fill="#fbfaf7" />
        </svg>
        <h1>Forge</h1>
        <div class="rule"></div>
        <p>Describe it. Ship it.</p>
      </div>
    </div>
  </body>
</html>
