name: Mirror HeyPuter Builder Root

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  mirror:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone HeyPuter builder
        run: |
          git clone --depth 1 https://github.com/HeyPuter/builder.git /tmp/heyputer-builder

      - name: Replace repository root exactly
        run: |
          mv .git /tmp/target-git
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a /tmp/heyputer-builder/. .
          rm -rf .git .github
          mv /tmp/target-git .git

      - name: Commit exact root mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f .
          git diff --cached --quiet && exit 0
          git commit -m "Replace GUPANUPAN2026 root with HeyPuter builder"
          git push origin HEAD:main
