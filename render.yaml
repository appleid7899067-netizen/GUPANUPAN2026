# Render Blueprint — GuPanu (GUPANUPAN2026)
services:
  - type: web
    name: gupanu
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npx playwright install chromium && NITRO_PRESET=node-server npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NITRO_PRESET
        value: node-server
